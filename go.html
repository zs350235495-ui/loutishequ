        :root {
            --bg-color: #FAFAFA;

            --text-muted: #71717A;
            --brand-orange: #FF5500;
            --brand-border: #18181B;
            --accent-green: #10B981;

        * {

            margin: 0;
            padding: 0;
        }

        body {

            color: var(--text-main);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(#d4d4d8 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .dispatch-card {

            border: 2px solid var(--brand-border);
            box-shadow: var(--shadow-brutal);
            max-width: 520px;
            width: 100%;
            padding: 32px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .dispatch-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--brand-orange);
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #18181B;
            color: #FFFFFF;
            font-family: monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .scanner-visual {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            background: #FFF7ED;
            border: 2px solid var(--brand-border);
            box-shadow: var(--shadow-subtle);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .scanner-visual svg {
            width: 34px;
            height: 34px;
            color: var(--brand-orange);
            animation: rotateCompass 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes rotateCompass {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .target-name {
            color: var(--brand-orange);
            font-weight: 900;
        }

        .meta-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;

        .status-box {
            background: #F4F4F5;
            border: 1px dashed #A1A1AA;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-label {
            color: #71717A;
        }

        .status-val {
            font-weight: bold;
            color: var(--text-main);
        }

        .btn-redirect {

            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 800;
            color: #FFFFFF;
            background-color: var(--brand-orange);
            border: 2px solid var(--brand-border);
            box-shadow: var(--shadow-subtle);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: monospace;
        }

        .btn-redirect:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--brand-border);
            background-color: #EA4A00;
        }

        .btn-redirect:active {

        .btn-home {

            margin-top: 10px;

        }

        .footer-note {

            font-size: 11px;
            font-family: monospace;
            color: #A1A1AA;

</head>
